<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PPL">
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>PPL Overload</title>
</head>
<body>
  <header class="topbar"><h1 id="title">PPL</h1></header>

  <main id="view"></main>

  <div id="restBar" hidden>
    <span id="restLabel">Rest</span>
    <b id="restTime">0:00</b>
    <button data-action="restAdd">+30s</button>
    <button data-action="restSkip">Skip</button>
  </div>

  <nav class="tabbar">
    <button data-action="tab" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M3 10v4M6.5 7v10M17.5 7v10M21 10v4M6.5 12h11"/></svg><span>Today</span>
    </button>
    <button data-action="tab" data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg><span>Progress</span>
    </button>
    <button data-action="tab" data-tab="history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>History</span>
    </button>
    <button data-action="tab" data-tab="program">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Program</span>
    </button>
  </nav>

  <div id="sheet" hidden>
    <div class="backdrop" data-action="closeSheet"></div>
    <div class="panel" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" data-bind="importFile" hidden>

  <script src="app.js"></script>
</body>
</html>
